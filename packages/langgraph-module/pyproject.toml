[project]
name = "langgraph-module"
version = "0.1.0"
description = "Packaged LangGraph multi-agent supervisor examples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=8.0",
    "langchain-core>=1.2.12",
    "langchain-openai==1.1.11",
    "langchain-tavily>=0.2.18",
    "langgraph==1.1.3",
    "nest-asyncio>=1.6.0",
    "pydantic>=2.0",
    "python-dotenv==1.2.2",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_module"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/langgraph_module",
    "/README.md",
    "/pyproject.toml",
]
